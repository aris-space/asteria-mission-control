default_scenario = "default"

[mavlink]
system_id = 222
address = { protocol = "tcp", remote = "127.0.0.1:5760" }

[scenario.default]
name = "Default"
state_machines = ["fc", "rfs"]

[scenario.other]
name = "Other"
state_machines = ["fc"]

[state_machine.fc]
name = "Flight Computer"
diagram_path = "state-machine.svg"
config_path = "remote-computers/flight-computer/configs/flight/fc_flight_state_machine.toml"

[state_machine.rfs]
name = "Remote Fueling Station"
diagram_path = "state-machine.svg"
config_path = "remote-computers/flight-computer/configs/flight/fc_flight_state_machine.toml"
