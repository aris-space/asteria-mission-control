configs_repository_path = "./remote-computers"

[mavlink]
system_id = 222
logs_path = "./mavlink-logs"

[remote.docker-fc]
kind = "flight computer"
description = "Flight computer running in a docker container. Only needed for development purposes!"
mavlink = { protocol = "tcp", remote = "localhost:5766" }

[remote.docker-replay]
kind = "flight computer"
description = "Pseudo flight computer replaying the MavLink messages from a log file. Only needed for development purposes!"
mavlink = { protocol = "tcp", remote = "localhost:5776" }

[remote.hermes-2-asd]
kind = "flight computer"
description = "Flight computer running on raspberry pi via asd."
mavlink = { protocol = "tcp", remote = "hermes2.local:5766" }

[remote.hermes-3-asd]
kind = "flight computer"
description = "Flight computer Hermes 3 running on raspberry pi via asd."
mavlink = { protocol = "tcp", remote = "hermes3.local:5766" }

[remote.FC-Radio]
kind = "flight computer"
description = "Flight computer connected via radio on serial."
mavlink = { protocol = "serial", path = "/dev/ttyACM0", baud_rate = 115200 }

[remote.RFSC]
kind = "rfs computer"
description = "Remote filling station computer connected via IP."
mavlink = { protocol = "tcp", remote = "rfsc.local:5760" }

[pss]
rocket_diagram_path = "./rocket-pss.svg"
rfs_diagram_path = "./rfs-pss.svg"

[influx]
address = "http://localhost:8086"
organization = "ARIS"
bucket = "ASTERIA"

[tiles.osm]
description = "OpenStreetMap (Online)"
url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"

[tiles.duebendorf]
description = "Dübendorf (Docker)"
url = "http://localhost:8877/duebendorf.pmtiles"
# url = "http://localhost:8080/duebendorf/{z}/{x}/{y}.mvt"
pmtiles = true