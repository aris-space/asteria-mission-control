services:
  mission-control:
    profiles: ["mission-control", "full"]
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      # map container port 80 to host port 8888
      - "8888:80"
    volumes:
      - ./remote-computers/flight-computer/configs:/app/remote-computers/flight-computer/configs:ro
      - ./remote-computers/state-machines:/app/remote-computers/state-machines:ro
      - ./config.toml:/app/config.toml:ro

  flight-computer:
    profiles: ["flight-computer", "remote-computers", "full"]
    build:
      context: .
      dockerfile: ./fc.Dockerfile
    cap_add:
      # needed to create the virtual can interface
      - NET_ADMIN
    configs:
      - source: mavlink-router
        target: /etc/mavlink-router/main.conf
    ports:
      # MavLink router TCP server.
      - "5766:5766"
      # SSH daemon.
      - "2222:22"
    volumes:
      - ./remote-computers/flight-computer/configs:/app/configs:ro
    command: flight-computer /app/configs/drop_test_campaign/drogue_out_drop_test_template.toml

  replay:
    profiles: ["replay", "remote-computers", "full"]
    build:
      context: .
      dockerfile: ./replay.Dockerfile
    cap_add:
      # needed to create the virtual can interface
      - NET_ADMIN
    configs:
      - source: mavlink-router
        target: /etc/mavlink-router/main.conf
    ports:
      # MavLink router TCP server.
      - "5776:5766"
    volumes:
      - ./replays:/app/replays:ro
    command: mavlink-log-replay --path /app/replays/droptest.jsonl --speed 1.5 tcp localhost:5766

  # Local InfluxDB to aggregate telemetry
  influxdb2:
    image: influxdb:2
    profiles: ["logging", "full"]
    ports:
      - 8086:8086 # default port that influxdb exposes
    env_file:
      - .env
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN_LOCAL}
      DOCKER_INFLUXDB_INIT_ORG: ARIS
      DOCKER_INFLUXDB_INIT_BUCKET: ASTERIA
    volumes:
      - type: volume
        source: influxdb2-data
        target: /var/lib/influxdb2
      - type: volume
        source: influxdb2-config
        target: /etc/influxdb2

  # Local grafana to plot telemetry
  grafana:
    image: grafana/grafana:10.4.2
    profiles: ["logging", "full"]
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${INFLUXDB_USERNAME}
      - GF_SECURITY_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_TOKEN_LOCAL=${INFLUXDB_TOKEN_LOCAL}
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=100ms
      - GF_LIVE_EVENT_BUFFER_SIZE=1000000
      - GF_USERS_DEFAULT_THEME=light

configs:
  mavlink-router:
    content: |
      [General]
      TcpServerPort = 5766
      Forwarding = True

      # -------------------------------------
      # UDP ENDPOINT DEFINITIONS
      # -------------------------------------

      # Endpoint for the flight computer connection
      [UdpEndpoint flight_computer]
      Mode = Server
      Address = 127.0.0.1
      Port = 5760

volumes:
  influxdb2-data:
  influxdb2-config:
