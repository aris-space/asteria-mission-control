name: check code
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# If new code is pushed to a PR branch, then cancel in progress workflows for that PR. Ensures that
# we don't waste CI time, and returns results quicker https://github.com/jonhoo/rust-ci-conf/pull/5
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  test:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    name: ⚙️ test (ubuntu)
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: recursive
      - name: Install stable
        uses: dtolnay/rust-toolchain@stable
      - name: cargo generate-lockfile
        # enable this ci template to run regardless of whether the lockfile is checked in or not
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: cargo test --locked
        # Not using `--all-targets`, to get doctests everywhere.
        run: cargo test --locked --workspace --all-features -- --skip skipci
  fmt:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    name: 🖋️ fmt
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: recursive
      - name: Install nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check
  frontend:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    name: ⚙️ lint and build frontend
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Lint
        working-directory: ui
        run: npm run lint
      - name: Build
        working-directory: ui
        run: npm run build
  clippy:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    name: 📋 clippy
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # Catch new lints early
        toolchain: [beta]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ASTERIA_CI_TOKEN }}
          submodules: recursive
      - name: Install ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2 # Cache Rust build artifacts
      - name: cargo clippy
        uses: giraffate/clippy-action@v1
        with:
          clippy_flags: --workspace --all-targets --all-features -- -Dwarnings
          reporter: 'github-pr-check'
          tool_name: clippy results
          filter_mode: nofilter
