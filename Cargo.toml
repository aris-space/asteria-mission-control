[package]
name = "asteria-mission-control"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-web = { version = "4.11.0", features = ["rustls"] }
actix-web-lab = "0.24.3"
chrono = "0.4.42"
clap = { version = "4.5.51", features = ["derive", "env"] }
env_logger = "0.11.8"
futures = "0.3.31"
html-escape = "0.2.13"
html_parser = "0.7.0"
log = "0.4.28"
quick-xml = { version = "0.38.4", features = ["serialize"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.17"
toml = { version = "0.9.8", features = ["serde"] }
utoipa = { version = "5.4.0", features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-rapidoc = { version = "6.0.0", features = ["actix-web"] }
hermes-mavlink = { path = "./mavlink", features = ["serde", "hermes"] }
mavlink-core = { version = "0.13.1", features = ["serde", "std", "tcp", "udp"], default-features = false }
