[package]
name = "asteria-mission-control"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "mavlink", "mavlink-log-replay"]

[workspace.dependencies]
arbitrary = { version = "1.4.1", features = ["derive"] }
asteria-messages = { package = "messages", path = "data-definitions/messages", default-features = false, features = [
  "mavlink",
  "mission-control",
  "pss",
  "derive_facet",
  "derive_debug",
] }
bincode = { version = "2.0.1", default-features = false, features = [
  "derive",
  "serde"
] }
clap = { version = "4.5.51", features = ["derive", "env"] }
defmt = { version = "1.0.1" }
env_logger = "0.11.8"
facet = { version = "0.46.0" }
log = "0.4.28"
mavio = { version = "0.5.10", features = ["serde", "std", "tokio"] }
mavlink-lib = { package = "mavlink", path = "mavlink" }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = "1.0.145"
socket2 = { version = "0.6.1", features = ["all"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time"
] }
utoipa = { version = "5.4.0" }

[workspace.lints.clippy]
doc_markdown = "allow"  # Too many false positives for acronymes I can't bother to whitelist
duration-suboptimal-units = "allow"  # Don't want to bump MSRV yet
ignored_unit_patterns = "allow"  # Not clearer to me
implicit_hasher = "allow"  # We'll only ever use the default hasher
missing_errors_doc = "allow"  # Important, but the needing a section is not always pretty.
missing_panics_doc = "allow"  # Functions shouldn't panic, if contain panic code, it should be unreachable
must_use_candidate = "allow"  # Not all `new` calls are problematic to not use
unsafe_derive_deserialize = "allow"  # Appears when serde and facet are both derived
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.lints.rustdoc]
private_intra_doc_links = "allow"  # We don't export our docs

[dependencies]
actix-cors = "0.7.1"
actix-files = { version = "0.6.9", optional = true }
actix-web = { version = "4.11.0", features = ["rustls"] }
actix-web-lab = "0.24.3"
asteria-datapoint-information = { package = "datapoint-information", path = "data-definitions/datapoint-information", features = [
  "mission-control",
  "csv"
] }
asteria-datatypes = { package = "datatypes", path = "data-definitions/datatypes" }
asteria-messages.workspace = true
async-trait = "0.1.89"
chrono = "0.4.42"
clap.workspace = true
env_logger.workspace = true
futures = "0.3.31"
gix = { version = "0.81.0", default-features = false, features = [
  "parallel",
  "revision",
  "sha1"
] }
html-escape = "0.2.13"
html_parser = "0.7.0"
log.workspace = true
mavio.workspace = true
mavlink-lib.workspace = true
quick-xml = { version = "0.38.4", features = ["serialize"] }
schemars = "1.1.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream = "0.1.17"
tokio-util = "0.7.18"
toml = { version = "0.9.8", features = ["serde"] }
utoipa = { workspace = true, features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-rapidoc = { version = "6.0.0", features = ["actix-web"] }
influxdb2 = { version = "0.5.2", default-features = false, features = ["rustls", "gzip"] }
lazy_static = "1.5.0"
facet.workspace = true
facet-reflect = "0.46.5"

[features]
default = []
static-frontend = ["dep:actix-files"]
